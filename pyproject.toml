[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "basa-id"
version = "0.1.0"
description = "Learn Indonesia's regional languages, one conversation at a time"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Basa.id Contributors" }]
keywords = ["language-learning", "telegram-bot", "whatsapp-bot", "indonesia", "batak", "javanese", "sundanese"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "pydantic-settings>=2.2",
    "python-telegram-bot>=21,<22",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Faber-Aritonang/basa-id-bot"
Repository = "https://github.com/Faber-Aritonang/basa-id-bot"
Documentation = "https://github.com/Faber-Aritonang/basa-id-bot/blob/main/README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Driver PostgreSQL — wajib saat DATABASE_URL memakai postgresql+psycopg://
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
basa = "basa.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
