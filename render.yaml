# Basa.id — Blueprint Render (deploy via dashboard atau CLI).
#
#   dashboard.render.com → New → Blueprint → pilih repo GitHub ini.
#   atau CLI: render blueprint launch --repo Faber-Aritonang/basa-id-bot
#
# Blueprint ini membuat:
#   - 1 PostgreSQL (plan free) bernama `basa-db`
#   - 1 Web Service (Docker, plan free) bernama `basa-bot`
#     yang menjalankan migrasi + seed + bot (lihat CMD di Dockerfile;
#     Render melarang `startCommand` pada service runtime: docker).
#
# Setelah blueprint dibuat, Render MEMINTA Anda mengisi nilai rahasia
# (TELEGRAM_BOT_TOKEN) di dashboard — token tidak boleh ada di git.

databases:
  - name: basa-db
    plan: free
    databaseName: basa
    user: basa

services:
  - type: web
    name: basa-bot
    runtime: docker
    plan: free
    autoDeploy: true
    # Health check: aplikasi bind ke $PORT (Render menyuntikkannya) dan
    # menjawab 200 di / dan /healthz — lihat src/basa/health.py.
    healthCheckPath: /
    # Perintah start (migrate + seed + run) ada di CMD Dockerfile — Render
    # membangun Dockerfile sendiri (auto-detect di root repo).
    envVars:
      - key: PLATFORM
        value: telegram
      # Diisi manual di dashboard Render (sync: false = tidak dari blueprint).
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: basa-db
          property: connectionString
